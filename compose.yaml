services:
  web:
    build:
      context: .
      target: deps
    working_dir: /app
    command: yarn dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    # No NODE_ENV here on purpose. `next dev` sets development itself,
    # and a container-wide NODE_ENV=development leaks into `yarn build`
    # runs exec'd in this container, mixing development and production
    # React in one bundle — prerender then dies nondeterministically
    # with "Cannot read properties of null (reading 'useState')".

volumes:
  node_modules:
